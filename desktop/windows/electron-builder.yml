# electron-builder.yml — packaging de l'application bureau (Windows).
appId: com.employee.app
productName: Employee
directories:
  output: release
files:
  - electron/dist/**/*
  - package.json
extraResources:
  - from: .next/standalone
    to: standalone
  # electron-builder ignore silencieusement les dossiers node_modules dans
  # une copie from/to globale : copie explicite, sinon le serveur embarque
  # meurt avec "Cannot find module 'next'".
  - from: .next/standalone/node_modules
    to: standalone/node_modules
asar: true
# Mises a jour auto (Windows NSIS) : electron-builder genere latest.yml
# dans release/ (publie sur la Release GitHub par la CI) et app-update.yml
# dans resources/ (lu par electron-updater au demarrage).
publish:
  provider: github
  owner: phaladamou
  repo: employee-platform
# Pas de modules natifs au runtime (postgres-js et bcrypt-ts = pur JS) :
# inutile de recompiler, et cross-compilation Linux -> Windows impossible.
npmRebuild: false
win:
  target:
    - nsis
  artifactName: Employee-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
